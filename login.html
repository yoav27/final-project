<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- עיצוב מסך חצוי (Split Screen) -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
        }

        /* מעטפת ראשית שמחלקת את המסך ל-2 חלקים */
        .split-container {
            display: flex;
            width: 100vw;
            min-height: 100vh;
        }

        /* ----------------------------------
           צד שמאל: האזור הוויזואלי (50% בדיוק)
        ---------------------------------- */
        .left-side {
            width: 50%;
            flex: 0 0 50%;
            background: linear-gradient(135deg, #e3b02b 0%, #c48a00 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            text-align: center;
        }

        .left-content {
            max-width: 480px;
        }

        .hero-icon {
            font-size: 100px;
            margin-bottom: 30px;
            color: #ffffff;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15));
        }

        .hero-title {
            font-size: 38px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .hero-description {
            font-size: 18px;
            line-height: 1.6;
            opacity: 0.95;
            margin-bottom: 40px;
        }

        /* אלמנט עיצובי בתחתית צד שמאל */
        .features-list {
            display: flex;
            gap: 20px;
            justify-content: center;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            padding-top: 30px;
        }

        .feature-item {
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ----------------------------------
           צד ימין: טופס ההתחברות
        ---------------------------------- */
        .right-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background-color: #ffffff;
        }

        .login-box {
            width: 100%;
            max-width: 380px;
        }

        .welcome-title {
            font-size: 40px;
            font-weight: 700;
            color: #e3b02b;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 22px;
            margin-bottom: 30px;
            color: #3d3b36;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #4a4744;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            padding-right: 40px;
            font-size: 15px;
            border: 1px solid #e0dcd5;
            border-radius: 8px;
            outline: none;
            background-color: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: #e3b02b;
            box-shadow: 0 0 0 3px rgba(227, 176, 43, 0.2);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            color: #d99b00;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-submit {
            width: 100%;
            background-color: #e3b02b;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-submit:hover {
            background-color: #c48a00;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .signup-text {
            margin-top: 25px;
            text-align: center;
            font-size: 14px;
            color: #666059;
        }

        .signup-text a {
            color: #d99b00;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        /* התאמה לניידים - אם המסך קטן, הצדדים יסתדרו טורית */
        @media (max-width: 850px) {
            .split-container {
                flex-direction: column;
            }
            .left-side {
                padding: 40px 20px;
            }
            .right-side {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="split-container">
        
        <!-- צד שמאל: עיצוב ויזואלי -->
        <div class="left-side">
            <div class="left-content">
                <i class="fa-solid fa-folder-open hero-icon"></i>
                <h1 class="hero-title">Fast & Secure File Sharing</h1>
                <p class="hero-description">
                    Manage, store, and share your files effortlessly anywhere, anytime. Simple, fast, and completely secure.
                </p>
                <div class="features-list">
                    <div class="feature-item"><i class="fa-solid fa-shield-halved"></i> Secure</div>
                    <div class="feature-item"><i class="fa-solid fa-bolt"></i> Fast Upload</div>
                    <div class="feature-item"><i class="fa-solid fa-cloud"></i> Cloud Storage</div>
                </div>
            </div>
        </div>

        <!-- צד ימין: טופס התחברות -->
        <div class="right-side">
            <div class="login-box">
                <h1 class="welcome-title">Welcome</h1>
                <h2 class="login-subtitle">Login</h2>
                
                <form id="loginForm">
                    <!-- שדה אימייל -->
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                    </div>

                    <!-- שדה סיסמה עם עין -->
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                            <button type="button" class="toggle-password" id="togglePasswordBtn">
                                <i class="fa-regular fa-eye" id="toggleIcon"></i>
                            </button>
                        </div>
                    </div>    

                    <!-- כפתור התחברות -->
                    <button type="submit" class="btn-submit">Log In</button>

                    <!-- קישור הרשמה -->
                    <p class="signup-text">
                        You don't have user? <a href="#">Sign up</a>
                    </p>
                </form>
            </div>
        </div>

    </div>  

</body>
</html>
